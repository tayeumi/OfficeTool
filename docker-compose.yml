services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    image: ${OFFICETOOL_IMAGE:-ghcr.io/tayeumi/officetool:latest}
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "${OFFICETOOL_PORT:-30003}:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DIR=/data/storage
      - FILE_TTL_MINUTES=60
    depends_on:
      - redis
    volumes:
      - storage-data:/data/storage

volumes:
  redis-data:
  storage-data:
